name: Scheduled Data Refresh

on:
  schedule:
    # Run every Tuesday at 02:00 WIB (Monday 19:00 UTC)
    - cron: "0 19 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Force refresh all snapshots"
        required: false
        default: false
        type: boolean

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch and verify latest DJPK data
        run: npm run data:refresh

      - name: Run integrity tests on newly fetched data
        run: npm test

      - name: Create Pull Request for data review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): sync latest DJPK APBD snapshots"
          title: "chore(data): sync latest DJPK APBD snapshots"
          body: |
            Pembaruan berkala dataset APBD resmi dari portal DJPK Kementerian Keuangan.
            - Menjalankan pemeriksaan atomik dan ekstraksi via `npm run data:refresh`
            - Lolos seluruh 23 unit test integritas dan verifikasi SHA-256
          branch: "data-sync-update"
          delete-branch: true
          add-paths: |
            data/snapshots.json
            public/data/raw/**
